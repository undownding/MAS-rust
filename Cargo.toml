[package]
name = "mas-rust"
version = "0.6.0-dev.3"
edition = "2024"
description = "Rust desktop interface for Microsoft Activation Scripts"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "x11", "wayland"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
thiserror = "2.0.17"
tempfile = "3.27"
base64 = "0.22.1"
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = { version = "0.10.9", features = ["oid"] }

serde_json = "1.0.151"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
sha1 = { version = "0.10.7", features = ["oid"] }
hmac = "0.12.1"

[target.'cfg(windows)'.dependencies]
roxmltree = "0.21.2"
uuid = "1.29"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_Globalization", "Win32_System_SystemInformation"] }

wmi = "0.18.4"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell"] }

[dev-dependencies]
roxmltree = "0.21.2"
uuid = "1.29"

[build-dependencies]
winresource = "0.1.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
